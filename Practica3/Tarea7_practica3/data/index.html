<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 - Reloj</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>⏱ Reloj ESP32</h1>
    <p>Tiempo transcurrido desde el arranque:</p>
    <div id="clock">%TIME%</div>
    <button onclick="resetClock()">🔄 Reset a 00:00:00</button>
  </div>

  <script>
    // Actualiza el reloj cada segundo pidiendo al ESP32 la hora
    setInterval(() => {
      fetch('/time')
        .then(r => r.text())
        .then(t => document.getElementById('clock').innerText = t)
        .catch(e => console.error('Error al obtener hora:', e));
    }, 1000);

    // Resetea la hora en el ESP32
    function resetClock() {
      fetch('/reset')
        .then(() => document.getElementById('clock').innerText = '00:00:00')
        .catch(e => console.error('Error al resetear:', e));
    }
  </script>
</body>
</html>
